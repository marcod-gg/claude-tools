<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantenciones de flota</title>
<script>
    (function () {
        var STORAGE_KEY = 'flota-a11y', LEGACY_KEY = '', USE_PREF = true;
        var THEMES = ['light', 'light_colorblind', 'light_tritanopia', 'dark', 'dark_colorblind', 'dark_tritanopia'];
        var SIZES = [87.5, 100, 112.5, 125, 150];
        // Fuentes que se descargan de Google Fonts solo si se eligen ("system" no descarga nada; Roboto la carga el layout).
        var FONTS = { atkinson: 'Atkinson+Hyperlegible:wght@400;700', lexend: 'Lexend:wght@300;400;500;600;700;800' };
        var root = document.documentElement, mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        var pref = null;
        if (USE_PREF) { try { pref = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { } }
        else pref = { mode: 'single', single: 'light', day: 'light', night: 'dark' };   // sin sesión: tema estándar
        if (!pref || !pref.mode) {
            var old = null;
            try { old = USE_PREF && LEGACY_KEY ? localStorage.getItem(LEGACY_KEY) : null; } catch (e) { }
            // Sin preferencia: tema claro fijo (no cambia nada a quien ya usaba la app). Para seguir al sistema: mode 'auto'.
            pref = { mode: 'single', single: old === 'dark' ? 'dark' : 'light', day: 'light', night: 'dark' };
        }
        function current() {
            var t = pref.mode === 'auto' ? (mq && mq.matches ? pref.night : pref.day) : pref.single;
            return THEMES.indexOf(t) >= 0 ? t : 'light';
        }
        function apply() {
            var t = current().split('_');
            root.setAttribute('data-theme', t[0]);
            root.setAttribute('data-bs-theme', t[0]);   // Bootstrap 5.3: modales, dropdowns y formularios siguen el tema solos
            root.setAttribute('data-vision', t[1] || 'default');
            root.setAttribute('data-contrast', pref.contrast === 'high' ? 'high' : 'default');
            var font = (FONTS[pref.font] || pref.font === 'system') ? pref.font : 'roboto';
            root.setAttribute('data-font', font);
            if (FONTS[font]) {
                var link = document.getElementById('dt-font');
                if (!link) { link = document.createElement('link'); link.id = 'dt-font'; link.rel = 'stylesheet'; document.head.appendChild(link); }
                link.href = 'https://fonts.googleapis.com/css2?family=' + FONTS[font] + '&display=swap';
            }
            var size = SIZES.indexOf(+pref.size) >= 0 ? +pref.size : 100;
            root.style.fontSize = size === 100 ? '' : size + '%';   // la app debe usar rem para que escale
        }
        apply();
        if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (pref.mode === 'auto') apply(); });
        window.dtTheme = {
            themes: THEMES,
            sizes: SIZES,
            current: current,
            get: function () {
                return { mode: pref.mode, single: pref.single, day: pref.day, night: pref.night,
                         contrast: pref.contrast || 'default', font: pref.font || 'roboto', size: +pref.size || 100 };
            },
            set: function (p) {
                pref = p;
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) { }
                root.classList.add('theme-anim');
                setTimeout(function () { root.classList.remove('theme-anim'); }, 520);
                apply();
            }
        };
    })();
</script>

<style>
/* ============================================================================
   default-theme · Estilo predeterminado compartido de claude-tools (advanced-tanstack, organigrama y skills futuras).
   Fuente única: shared/default-theme/ en la raíz del repo; scripts/sync-default-theme.py lo copia a cada plugin.
   Estilos opcionales: estilos/calido.css o estilos/pizarra.css, cargados DESPUÉS de este archivo.
   <html data-theme="light|dark" data-vision="default|colorblind|tritanopia"
         data-contrast="default|high" data-font="roboto|atkinson|lexend|system">
   Lo fija el script del <head> (default-theme/head.html) desde localStorage.
   .dt-thp = tema aplicado a un elemento y no a la página: vista previa (página de Accesibilidad) o un espacio de
   trabajo con tema propio (DataViews). Lleva data-theme, data-vision y data-contrast en el mismo elemento.
   Cargar DESPUÉS de Bootstrap u otros frameworks para ganar la cascada.

   Tokens:
     Neutros   --dt-bg --dt-surface --dt-surface-2 --dt-border --dt-border-strong
               --dt-text --dt-text-body --dt-text-muted --dt-text-faint
     Marca     --dt-brand (texto/íconos/bordes de acento, ≥4.5:1)
               --dt-brand-emphasis (fondos rellenos con texto blanco, ≥4.5:1)
               --dt-brand-strong (hover/degradados) --dt-brand-subtle (tintes) --dt-brand-ghost
               --dt-accent --dt-accent-2 → SOLO decorativos, nunca texto
               --dt-logo-bg (fondo del cuadro del logo, el color de marca de la app) --dt-focus-ring
     Semánt.   --dt-success --dt-warning --dt-danger --dt-info (+ -bg)
     Estados   --dt-state-new --dt-state-active --dt-state-waiting --dt-state-pending
               --dt-state-done --dt-state-canceled --dt-state-extra (+ -bg)
     Fuente    --dt-font (+ --dt-font-mono para IDs, códigos y etiquetas técnicas)
     Forma     --dt-r-xs … --dt-r-xl --dt-r-pill · --dt-shadow-xs … --dt-shadow-lg · --dt-ease --dt-t
   ============================================================================ */

:root {
    --dt-font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --dt-font-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    /* Radios, sombras y movimiento */
    --dt-r-xs: 6px; --dt-r-sm: 8px; --dt-r-md: 10px; --dt-r-lg: 14px; --dt-r-xl: 18px; --dt-r-pill: 999px;
    --dt-shadow-xs: 0 1px 2px rgba(16, 24, 40, .05);
    --dt-shadow-sm: 0 1px 3px rgba(16, 24, 40, .07), 0 1px 2px rgba(16, 24, 40, .04);
    --dt-shadow-md: 0 4px 12px rgba(16, 24, 40, .08), 0 2px 4px rgba(16, 24, 40, .04);
    --dt-shadow-lg: 0 12px 32px rgba(16, 24, 40, .12), 0 4px 8px rgba(16, 24, 40, .05);
    --dt-ease: cubic-bezier(.4, 0, .2, 1);
    --dt-t: .18s var(--dt-ease);
}
/* Movimiento reducido: sin transiciones ni desplazamientos para quien lo pide en el sistema */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
body { font-family: var(--dt-font); background: var(--dt-bg); color: var(--dt-text-body); }

/* Transición SOLO durante el cambio de tema (la activa el script del <head> ~520 ms; no interfiere con hovers).
   Listas enormes (tableros, grillas de cientos de filas): marcarlas con .dt-no-theme-anim para evitar lag. */
@media (prefers-reduced-motion: no-preference) {
    html.theme-anim body, html.theme-anim *:not(i):not(svg):not(path) {
        transition: background-color .4s ease, border-color .4s ease, color .4s ease !important;
    }
}
html.theme-anim .dt-no-theme-anim, html.theme-anim .dt-no-theme-anim * { transition: none !important; }

/* ── Claro (GitHub light default) ── */
:root, .dt-thp[data-theme="light"] {
    color-scheme: light;
    /* Marca neutra (azul genérico): brand #0969DA = enlaces y acentos (5.2:1); emphasis #0550AE = fondos con texto blanco
       (7.6:1); subtle #DDF4FF = tintes; accent y accent-2 = solo decorativos (no texto). Para la marca de una app,
       reemplazar los --dt-brand-*, --dt-accent* y --dt-logo-bg (y revisar contraste). */
    --dt-brand: #0969da; --dt-brand-emphasis: #0550ae; --dt-brand-strong: #033d8b; --dt-brand-subtle: #ddf4ff; --dt-brand-ghost: rgba(9, 105, 218, .08);
    --dt-accent: #bf8700; --dt-accent-2: #8250df; --dt-logo-bg: #0550ae;
    --dt-bg: #f6f8fa; --dt-surface: #ffffff; --dt-surface-2: #f6f8fa; --dt-border: #d1d9e0; --dt-border-strong: #afb8c1;
    --dt-text: #1f2328; --dt-text-body: #2f353c; --dt-text-muted: #59636e; --dt-text-faint: #6e7781;
    --dt-focus-ring: 0 0 0 3px rgba(9, 105, 218, .3);

    /* Semánticos y estados (visión estándar) */
    --dt-success: #1a7f37; --dt-success-bg: #dafbe1;
    --dt-warning: #9a6700; --dt-warning-bg: #fff8c5;
    --dt-danger: #d1242f;  --dt-danger-bg: #ffebe9;
    --dt-info: #0969da;    --dt-info-bg: #ddf4ff;
    --dt-state-new: #d1242f;     --dt-state-new-bg: #ffebe9;
    --dt-state-active: #bc4c00;     --dt-state-active-bg: #fff1e5;
    --dt-state-waiting: #9a6700;    --dt-state-waiting-bg: #fff8c5;
    --dt-state-pending: #0969da; --dt-state-pending-bg: #ddf4ff;
    --dt-state-done: #1a7f37;  --dt-state-done-bg: #dafbe1;
    --dt-state-canceled: #59636e; --dt-state-canceled-bg: #f6f8fa;
    --dt-state-extra: #8250df;     --dt-state-extra-bg: #fbefff;
}

/* ── Oscuro (GitHub dark default) ── */

    color-scheme: dark;
    /* Acento azul claro (#4493F8 para texto, 5.6:1 sobre la superficie; #1F6FEB para fondos con texto blanco, 4.6:1). */
    --dt-brand: #4493f8; --dt-brand-emphasis: #1f6feb; --dt-brand-strong: #79c0ff; --dt-brand-subtle: #121d2f; --dt-brand-ghost: rgba(68, 147, 248, .16);
    --dt-accent: #d29922; --dt-accent-2: #ab7df8; --dt-logo-bg: #1f6feb;
    --dt-bg: #0d1117; --dt-surface: #151b23; --dt-surface-2: #010409; --dt-border: #3d444d; --dt-border-strong: #656c76;
    --dt-text: #f0f6fc; --dt-text-body: #d1d7e0; --dt-text-muted: #9198a1; --dt-text-faint: #8b949e;
    --dt-focus-ring: 0 0 0 3px rgba(68, 147, 248, .4);

    --dt-success: #3fb950; --dt-success-bg: #183c3e;
    --dt-warning: #d29922; --dt-warning-bg: #2f3736;
    --dt-danger: #f85149;  --dt-danger-bg: #352b3c;
    --dt-info: #4493f8;    --dt-info-bg: #121d2f;
    --dt-state-new: #f85149;     --dt-state-new-bg: #352b3c;
    --dt-state-active: #db6d28;     --dt-state-active-bg: #303037;
    --dt-state-waiting: #d29922;    --dt-state-waiting-bg: #2f3736;
    --dt-state-pending: #4493f8; --dt-state-pending-bg: #183658;
    --dt-state-done: #3fb950;  --dt-state-done-bg: #183c3e;
    --dt-state-canceled: #9198a1; --dt-state-canceled-bg: #212830;
    --dt-state-extra: #ab7df8;     --dt-state-extra-bg: #293258;
}

/* ── Daltonismo ──
   Semánticos como GitHub: protanopía/deuteranopía → éxito azul y peligro naranjo (sin pares rojo/verde);
   tritanopía → éxito azul y peligro rojo (sin pares azul/amarillo).
   Estados de ticket: paleta optimizada simulando protanopía, deuteranopía y tritanopía (Machado 2009): separación mínima
   ΔE ≥ 20 (claro) / ≥ 25 (oscuro) entre estados en los cuatro tipos de visión, contraste ≥ 4.5:1 sobre la superficie y cada
   estado en una familia de tono fija. Siempre van acompañados de nombre o icono (no solo color). */
:root[data-vision="colorblind"], .dt-thp[data-vision="colorblind"] {
    --dt-success: #0969da; --dt-success-bg: #ddf4ff;

    --dt-state-extra: #a444da;     --dt-state-extra-bg: #f6ecfb;
}

    --dt-state-extra: #c76afc;     --dt-state-extra-bg: #2c2b59;

/* ── Alto contraste (data-contrast="high"), como los temas "high contrast" de GitHub ──
   Neutros, marca y bordes a ≥ 7:1 (AAA) sobre la superficie; se combina con claro/oscuro y con daltonismo. */
:root[data-theme="light"][data-contrast="high"], .dt-thp[data-theme="light"][data-contrast="high"] {
    --dt-bg: #ffffff; --dt-surface: #ffffff; --dt-surface-2: #e6eaef; --dt-border: #59636e; --dt-border-strong: #20252c;
    --dt-text: #0e1116; --dt-text-body: #0e1116; --dt-text-muted: #25292e; --dt-text-faint: #454c54;
    --dt-brand: #0349b4; --dt-brand-emphasis: #033d8b; --dt-brand-strong: #033d8b; --dt-brand-subtle: #dff7ff; --dt-logo-bg: #033d8b;
    --dt-focus-ring: 0 0 0 3px #0349b4;
    --dt-state-canceled: #25292e;
}
:root[data-theme="dark"][data-contrast="high"], .dt-thp[data-theme="dark"][data-contrast="high"] {

    --dt-text: #ffffff; --dt-text-body: #f0f6fc; --dt-text-muted: #d1d7e0; --dt-text-faint: #b7bdc8;
    --dt-brand: #91cbff; --dt-brand-emphasis: #194fb1; --dt-brand-strong: #cae8ff; --dt-brand-subtle: #12253f; --dt-logo-bg: #194fb1;
    --dt-focus-ring: 0 0 0 3px #91cbff;

:root[data-theme="light"][data-contrast="high"][data-vision="default"], .dt-thp[data-theme="light"][data-contrast="high"][data-vision="default"] { /* mín. 7.3:1 */

:root[data-contrast="high"] :focus-visible, .dt-thp[data-contrast="high"] :focus-visible { outline: 3px solid var(--dt-brand) !important; outline-offset: 2px !important; }

/* ── Fuente (data-font): Roboto por defecto; Atkinson Hyperlegible y Lexend se cargan desde Google Fonts
   solo si se eligen (script del <head>). Se excluyen iconos (Font Awesome) y código. El tamaño se aplica como
   font-size en <html> (la app usa rem). ── */
:root[data-font="atkinson"] { --dt-font: 'Atkinson Hyperlegible', 'Segoe UI', sans-serif; }
:root[data-font="lexend"]   { --dt-font: 'Lexend', 'Segoe UI', sans-serif; }
:root[data-font="system"]   { --dt-font: system-ui, -apple-system, 'Segoe UI', sans-serif; }
:root[data-font]:not([data-font="roboto"]) body,
:root[data-font]:not([data-font="roboto"]) body *:not(i):not(svg):not(svg *):not(code):not(pre):not(kbd):not(.fa):not(.fas):not(.far):not(.fab):not([class^="fa-"]):not([class*=" fa-"]):not([class*="dt-font-sample"]) {
    font-family: var(--dt-font) !important;
}

/* Alias --c-* → --dt-* para usar DataViews con el tema por defecto (default-theme, tokens --dt-*). Cargar después de theme-tokens.css. */
:root, .dt-thp {   /* .dt-thp: el espacio de trabajo con tema propio (Estilo) recalcula los alias con sus --dt-* */

/*$vite$:1*/

html { scrollbar-gutter: stable; }
body { margin: 0; }
/* Look de la página como el demo del organigrama: Geist (solo con la fuente predeterminada; las de Accesibilidad mandan),
   título liviano, selector de diseño en píldora y fondo con puntos en tablero y tarjetas */
:root[data-font="roboto"] { --dt-font: "Geist", system-ui, sans-serif; --dt-font-mono: "Geist Mono", ui-monospace, monospace; }
.dv-seg { border-radius: 999px; padding: 3px; gap: 2px; }
.dv-seg button { border-radius: 999px; padding: 6px 14px; font-weight: 500; }
.dv-seg button + button { border-left: 0; }
.dv-seg button.is-active { background: var(--dt-text); color: var(--dt-bg); }
.dv-board, .dv-cards { background-image: radial-gradient(circle, color-mix(in srgb, var(--dt-text) 9%, transparent) 1px, transparent 1px); background-size: 22px 22px; }
#board-screen { max-width: 1600px; margin: 0 auto; padding: 28px 24px 48px; background: var(--dt-bg); }
#board-screen:fullscreen { max-width: none; overflow: auto; padding: 1rem 1.25rem; }
.fl-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.fl-head h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 300; letter-spacing: -0.03em; color: var(--dt-text); }
.fl-head p { margin: 0; color: var(--dt-text-muted); }
@media (max-width: 600px) { #board-screen { padding: 16px 16px 32px; } }

</style>
</head>

      <h1>Mantenciones de flota</h1>
      <p>Demo de DataViews · 140 mantenciones de prueba · solo lectura</p>
    </div>
  </div>
  <div id="dataviews-root"></div>
</div>
