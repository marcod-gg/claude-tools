<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organigrama · demo</title>
<!-- Generado por build.py desde index.html y los assets: no editar a mano. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<style>
/* Organigrama (skill organigrama de claude-tools). Solo tokens --org-*: el sitio los apunta a su marca en su :root.
   Los valores por defecto (neutros: grises y azul genérico) van en :where(:root) (especificidad cero), así cualquier
   :root del sitio los reemplaza. */
:where(:root) {
  --org-bg: #f6f8fa;
  --org-surface: #ffffff;
  --org-hover: #eff2f5;
  --org-line: #d1d9e0;
  --org-ink: #1f2328;
  --org-ink-2: #2f353c;
  --org-muted: #59636e;
  --org-accent: #0969da;
  --org-on-accent: #ffffff;
  --org-radius: 14px;
  --org-shadow: 0 1px 2px rgb(31 35 40 / .06), 0 24px 60px -20px rgb(31 35 40 / .24);
  --org-mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :where(:root) {
    --org-bg: #0d1117; --org-surface: #151b23; --org-hover: #212830; --org-line: #3d444d;
    --org-ink: #f0f6fc; --org-ink-2: #d1d7e0; --org-muted: #9198a1; --org-accent: #4493f8; --org-on-accent: #0d1117;
    --org-shadow: 0 24px 60px -20px rgb(0 0 0 / .7);
  }
}

/* ── Árbol con conectores ── */
.org { overflow-x: auto; padding: 8px 4px 28px; }
.org__arbol, .org-hijos { display: flex; justify-content: center; list-style: none; padding: 0; margin: 0; }
.org__arbol { gap: 28px; justify-content: safe center; }
.org-hijos { position: relative; padding-top: 24px; }
.org-hijos::before { content: ""; position: absolute; top: 0; left: 50%; height: 24px; border-left: 1px solid var(--org-line); }
.org-rama { position: relative; display: flex; flex-direction: column; align-items: center; padding: 24px 10px 0; }
.org__arbol > .org-rama { padding-top: 0; }
.org-hijos > .org-rama::before, .org-hijos > .org-rama::after { content: ""; position: absolute; top: 0; width: 50%; height: 24px; border-top: 1px solid var(--org-line); }
.org-hijos > .org-rama::before { right: 50%; }
.org-hijos > .org-rama::after { left: 50%; border-left: 1px solid var(--org-line); }
.org-hijos > .org-rama:first-child::before, .org-hijos > .org-rama:last-child::after { border-top: 0; }
.org-hijos > .org-rama:only-child::before { display: none; }
.org-hijos > .org-rama:only-child::after { border-top: 0; }

/* ── Nodos ── */
.org-nodo { width: 250px; display: grid; gap: 8px; align-content: start; padding: 14px 16px; background: var(--org-surface); border: 1px solid var(--org-line);
  border-radius: var(--org-radius); text-align: left; color: var(--org-ink); text-decoration: none; font: inherit; }
a.org-nodo:hover, button.org-nodo:hover { border-color: var(--org-accent); }
button.org-nodo { cursor: pointer; }
.org-nodo--persona { width: 230px; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 10px 12px; }
.org-nodo--persona .org-avatar { width: 32px; height: 32px; font-size: .74rem; }
.org-nodo__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.org-nodo__head b { font-weight: 500; letter-spacing: -0.01em; }
.org-nodo--equipo .org-nodo__head i { color: var(--org-muted); }
.org-persona__txt { display: grid; min-width: 0; }
.org-persona__txt b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org-persona__txt small, .org-pares .org-persona__txt span { font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org-pares .org-persona__txt span { font-size: inherit; }
.org-cargo { color: var(--org-ink-2); }
.org-muted { color: var(--org-muted); }
.org-avatar { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--org-accent) 16%, var(--org-surface));
  color: var(--org-accent); font: 500 .68rem/1 var(--org-mono); }
.org-personas { display: grid; gap: 24px; }
.org-subtitulo { font-size: 1.05rem; font-weight: 500; margin: 0; }
.org-sueltos, .org-transversales { display: grid; gap: 10px; }
.org-transversales__lista { display: flex; flex-wrap: wrap; gap: 12px; }
.org-pares { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.org-pares--grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.org-persona { font: inherit; font-size: .88rem; display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; border: 0; border-radius: 8px; background: none;
  color: var(--org-ink); text-align: left; }
button.org-persona { cursor: pointer; }
button.org-persona:hover { background: var(--org-hover); }
.org-vacio { color: var(--org-muted); padding: 24px 0; }

/* ── Visor: barra, lienzo con zoom y arrastre, marca de agua ── */
.orgv { border: 1px solid var(--org-line); border-radius: var(--org-radius); background: var(--org-surface); overflow: hidden; color: var(--org-ink); }
/* El ancho del árbol no empuja a la página: sin esto, dentro de un grid o flex (min-width: auto) el contenedor crece al
   ancho del árbol y el lienzo nunca hace scroll. width 100 % para no colapsar a 0 en un flex en fila. La copia exportada no. */
.orgv:not(.orgv--export) { container-type: inline-size; width: 100%; box-sizing: border-box; }
.orgv:fullscreen { display: flex; flex-direction: column; border-radius: 0; }
.orgv__barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-bottom: 1px solid var(--org-line); }
.orgv__buscar { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 240px; max-width: 360px; padding: 0 10px; border: 1px solid var(--org-line); border-radius: 999px;
  background: var(--org-bg); color: var(--org-muted); }
.orgv__buscar:focus-within { border-color: var(--org-accent); }
/* Doble clase: los estilos de inputs del sitio no le ponen un segundo borde */
.orgv .orgv__buscar input { font: inherit; font-size: .9rem; flex: 1; min-width: 0; padding: 8px 0; border: 0; border-radius: 0; background: none; color: var(--org-ink); outline: none; }
.orgv__conteo { font-size: .85rem; min-width: 5ch; }
.orgv__grupo { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; padding: 2px; border: 1px solid var(--org-line); border-radius: 999px; }
.orgv__btn { box-sizing: border-box; font: inherit; display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border: 0; border-radius: 999px; background: none;
  color: var(--org-ink-2); cursor: pointer; font-size: 1rem; list-style: none; }
.orgv__btn::-webkit-details-marker, .orgv__primario::-webkit-details-marker { display: none; }
.orgv__btn:hover { background: var(--org-hover); color: var(--org-ink); }
.orgv__btn--txt { display: inline-flex; gap: 6px; font-size: .88rem; border: 1px solid var(--org-line); }
.orgv__pct { min-width: 4.5ch; text-align: center; font: 500 .8rem/1 var(--org-mono); color: var(--org-muted); }
.orgv__menu { position: relative; }
.orgv__menu-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; display: grid; min-width: 260px; padding: 6px; background: var(--org-surface);
  border: 1px solid var(--org-line); border-radius: 12px; box-shadow: var(--org-shadow); }
.orgv__menu-panel button { font: inherit; font-size: .9rem; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 8px; background: none;
  color: var(--org-ink); cursor: pointer; text-align: left; }
.orgv__menu-panel button:hover { background: var(--org-hover); }
.orgv__menu-titulo { padding: 6px 10px 2px; font: 500 .66rem/1.4 var(--org-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--org-muted); }
.orgv__lienzo { overflow: auto; max-height: 72vh; min-height: 320px; cursor: grab; outline: none; overscroll-behavior: contain;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--org-ink) 9%, transparent) 1px, transparent 1px); background-size: 22px 22px; }
.orgv:fullscreen .orgv__lienzo { flex: 1; max-height: none; }
.orgv__lienzo:focus-visible { box-shadow: inset 0 0 0 2px var(--org-accent); }
.orgv__lienzo.es-arrastrando { cursor: grabbing; user-select: none; }
.orgv__hoja { width: max-content; min-width: 100%; padding: 20px 28px 36px; }
.orgv .org { overflow: visible; padding: 8px 0 0; }
/* Marca de agua arriba a la izquierda: queda fija al desplazarse en horizontal y sale en las descargas */
.orgv__marca { position: sticky; left: 0; display: flex; align-items: center; gap: 12px; width: max-content; margin-bottom: 20px; padding: 10px 16px 10px 12px;
  border: 1px solid var(--org-line); border-radius: 14px; background: color-mix(in srgb, var(--org-surface) 88%, transparent); backdrop-filter: blur(6px); }
.orgv__sello { flex: none; width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--org-accent); }
/* Logo de la marca (op.logo) en lugar del sello: alto fijo, ancho según su proporción */
.orgv__logo { flex: none; display: block; height: 30px; width: auto; max-width: 120px; object-fit: contain; }
.orgv__marca > div { display: grid; line-height: 1.25; }
.orgv__eyebrow { font: 500 .66rem/1.4 var(--org-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--org-accent); }
.orgv__marca b { font-weight: 500; font-size: 1.05rem; letter-spacing: -0.01em; }
.orgv__marca small { font-size: .74rem; color: var(--org-muted); }
/* La firma usa la tipografía del sitio: html-to-image no siempre incrusta fuentes decorativas (Google Fonts) y caería a una genérica */
.orgv__firma { font-weight: 500; color: var(--org-ink-2); }
.orgv__parte { color: var(--org-accent) !important; font-weight: 500; }

/* ── Buscador ── */
.org-nodo.es-hallado, .org-persona.es-hallado { outline: 2px solid color-mix(in srgb, var(--org-accent) 45%, transparent); outline-offset: 2px; }
.org-nodo.es-actual, .org-persona.es-actual { outline-color: var(--org-accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--org-accent) 16%, transparent); }

/* ── Descargar una parte: tres pasos y vista previa (lo que queda fuera se atenúa) ── */
.orgv__seleccion { position: relative; display: grid; grid-template-columns: minmax(220px, 1.2fr) auto 1fr auto; align-items: center; gap: 12px 28px;
  padding: 14px 16px; border-bottom: 1px solid var(--org-line); background: color-mix(in srgb, var(--org-accent) 7%, var(--org-surface)); }
.orgv__seleccion[hidden] { display: none; }
.orgv__paso { display: flex; align-items: center; gap: 12px; min-width: 0; }
.orgv__num { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--org-accent); color: var(--org-on-accent); font: 500 .78rem/1 var(--org-mono); }
.orgv__paso-cuerpo { display: grid; gap: 4px; min-width: 0; }
.orgv__paso-titulo { font: 500 .66rem/1.4 var(--org-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--org-muted); }
.orgv__desde { display: flex; align-items: center; gap: 8px; min-height: 34px; min-width: 0; font-size: .9rem; }
.orgv__desde > i { color: var(--org-accent); font-size: 1.1rem; }
.orgv__seg { display: inline-flex; border: 1px solid var(--org-line); border-radius: 999px; padding: 3px; background: var(--org-surface); }
.orgv__seg button { font: inherit; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 0; border-radius: 999px; background: none; color: var(--org-muted); cursor: pointer; }
.orgv__seg button[aria-pressed="true"] { background: var(--org-ink); color: var(--org-bg); }
.orgv__dir-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.orgv__pares { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; cursor: pointer; white-space: nowrap; }
.orgv__pares[hidden] { display: none; }
.orgv__pares input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.orgv__switch { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--org-line); transition: background-color .2s; }
.orgv__switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--org-surface);
  box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .2s cubic-bezier(.16,1,.3,1); }
.orgv__pares input:checked + .orgv__switch { background: var(--org-accent); }
.orgv__pares input:checked + .orgv__switch::after { transform: translateX(14px); }
.orgv__pares input:focus-visible + .orgv__switch { outline: 2px solid var(--org-accent); outline-offset: 2px; }
.orgv__sel-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.orgv__cuenta { font-size: .82rem; }
.orgv__cerrar { align-self: start; }
.orgv__primario { list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--org-accent); color: var(--org-on-accent);
  font-size: .88rem; font-weight: 500; cursor: pointer; }
.orgv__como > summary .ph-caret-down { transition: transform .2s; }
.orgv__como[open] > summary .ph-caret-down { transform: rotate(180deg); }
.orgv__como.es-inactivo > summary { opacity: .5; cursor: not-allowed; }
.orgv__como .orgv__menu-panel { left: 0; right: auto; min-width: 190px; }
.orgv__hoja.es-seleccionando .org-rama > .org-nodo { cursor: crosshair; }
.orgv__hoja.es-seleccionando .org-rama > .org-nodo:hover { outline: 2px dashed var(--org-accent); outline-offset: 3px; }
.orgv__hoja .es-fuera { opacity: .28; filter: grayscale(.6); }
.org-nodo.es-elegida { outline: 2px solid var(--org-accent); outline-offset: 3px; }
/* Visor angosto (celular o columna): buscador en su línea; zoom, Descargar (solo ícono) y pantalla completa en la segunda */
@container (max-width: 560px) {
  .orgv__barra { gap: 8px 6px; padding: 8px 10px; }
  .orgv__buscar { flex: 1 1 100%; max-width: none; }
  .orgv__conteo:empty { display: none; }
  .orgv__grupo { margin-left: 0; margin-right: auto; }
  .orgv__btn--txt { gap: 0; padding: 0 8px; }
  /* El menú Descargar se ancla a la barra (no al botón): ocupa su ancho y no se corta por la izquierda */
  .orgv__barra { position: relative; }
  .orgv__barra > .orgv__menu { position: static; }
  .orgv__barra > .orgv__menu > .orgv__menu-panel { left: 10px; right: 10px; top: calc(100% - 4px); min-width: 0; }
  .orgv__btn--txt > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}
@media (max-width: 900px) { .orgv__seleccion { grid-template-columns: 1fr auto; } .orgv__seleccion > .orgv__paso { grid-column: 1; } .orgv__cerrar { grid-row: 1; grid-column: 2; } }

/* ── Copia para exportar: fuera de pantalla, a tamaño real, sin animaciones ── */
.orgv--export { position: fixed; left: -100000px; top: 0; border: 0; border-radius: 0; overflow: visible; }
.orgv--export .org-nodo, .orgv--export .org-persona { animation: none !important; transition: none !important; }
.orgv--export .orgv__marca { position: static; backdrop-filter: none; }
.orgv--export .orgv__hoja { background: var(--org-bg); }
/* PDF: solo la copia, en A4 horizontal. display:none (no visibility) para no dejar páginas en blanco */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body.org-imprimiendo > :not(#org-impresion) { display: none !important; }
  body.org-imprimiendo #org-impresion { position: static; display: block; }
  body.org-imprimiendo { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #org-impresion .orgv__hoja { width: auto; padding: 0; }
}

/* ── Animaciones: cada una muestra un cambio (aparecer por niveles, resultado actual, desplegar, opción nueva) ── */
@media (prefers-reduced-motion: no-preference) {
  .orgv .org-nodo { animation: org-aparecer .45s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--d, 0) * 70ms); }
  .org-nodo.es-actual, .org-persona.es-actual { animation: org-pulso 1s ease 2; }
  .orgv__menu[open] .orgv__menu-panel { animation: org-desplegar .2s cubic-bezier(.16,1,.3,1) both; }
  .org-nodo, .org-persona { transition: border-color .2s, background-color .2s, transform .2s cubic-bezier(.16,1,.3,1); }
  a.org-nodo:hover, button.org-nodo:hover { transform: translateY(-2px); }
  /* display discreto + @starting-style: anima también al ocultar (hidden) */
  .orgv__pares { transition: opacity .25s ease, transform .3s cubic-bezier(.16,1,.3,1), display .3s allow-discrete; }
  .orgv__pares[hidden] { opacity: 0; transform: translateX(-8px); }
  @starting-style { .orgv__pares:not([hidden]) { opacity: 0; transform: translateX(-8px); } }
}
@keyframes org-aparecer { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
@keyframes org-desplegar { from { opacity: 0; transform: translateY(-4px); } }
@keyframes org-pulso { 50% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--org-accent) 6%, transparent); } }

</style>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 32px 16px 64px; background: var(--org-bg); color: var(--org-ink); font: 400 1rem/1.6 "Geist", system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-weight: 300; letter-spacing: -0.03em; margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--org-line); border-radius: 999px; padding: 3px; background: var(--org-surface); width: fit-content; }
  .seg button { font: inherit; font-size: .9rem; padding: 7px 14px; border: 0; border-radius: 999px; background: none; color: var(--org-muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--org-ink); color: var(--org-bg); }
  #aviso:empty { display: none; }
  #aviso { color: var(--org-accent); }
</style>
</head>
<body>
<main>
  <h1>Organigrama · demo</h1>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-v="personas" aria-pressed="true">Personas</button>
    <button type="button" data-v="equipos" aria-pressed="false">Equipos</button>
    <button type="button" data-v="equipo" aria-pressed="false">Un equipo (TI)</button>
  </div>
  <p id="aviso" role="status"></p>
  <div id="vista"></div>
</main>
<script type="module">

// Organigrama · módulo ES sin dependencias (skill organigrama de claude-tools).
//   organigramaPersonas(personas, op)  árbol por jefatura directa; sin jefatura ni reportes van aparte, como pares
//   organigramaEquipos(equipos, op)    árbol de equipos anidados (áreas) y los transversales aparte
//   arbolEquipos(equipos)              ruta, subequipos e integrantes heredados (un equipo incluye a sus subequipos)
//   visorOrganigrama(contenido, op)    marca de agua, zoom, buscador, arrastre, pantalla completa y descarga PNG/PDF
//                                      de todo o de una parte (descendente, ascendente, ascendente con pares)
// Íconos: Phosphor (https://phosphoricons.com) por defecto; se cambian con op.icono. Estilos en organigrama.css (tokens --org-*).
// PNG: html-to-image se carga desde jsDelivr solo al pedir la descarga. PDF: el diálogo de impresión con una copia del árbol.

const HTML_TO_IMAGE = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';

// ── Utilidades ──────────────────────────────────────────────────────────
// dataset es de solo lectura: se copia campo a campo (Object.assign sobre el elemento lo ignora sin error)
function el(tag, { dataset, ...props } = {}, ...hijos) {
  const e = Object.assign(document.createElement(tag), props);
  if (dataset) Object.assign(e.dataset, dataset);
  e.append(...hijos.filter(h => h != null && h !== false));
  return e;
}
const iconoPhosphor = n => el('i', { className: `ph ph-${n}`, ariaHidden: 'true' });
const iniciales = n => String(n ?? '').split(/\s+/).slice(0, 2).map(p => p[0] ?? '').join('').toUpperCase();
const normalizar = s => String(s ?? '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const menosMovimiento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const vacio = txt => el('p', { className: 'org-vacio', textContent: txt });
const cargarScript = src => new Promise((listo, falla) => {
  const previo = document.querySelector(`script[data-src="${src}"]`);
  if (previo?.dataset.listo) return listo();
  const s = Object.assign(document.createElement('script'), { src, onload: () => { s.dataset.listo = '1'; listo(); }, onerror: () => falla(new Error('no se pudo cargar la herramienta de imagen')) });
  s.dataset.src = src;
  document.head.append(s);
});

// Árbol con conectores: items = raíces; hijos(item) = sus hijos; nodo(item) = recuadro. --d = profundidad (aparecen de arriba abajo)
function arbolOrg(items, hijos, nodo) {
  const rama = (x, d) => {
    const hs = hijos(x);

// ── Personas por jefatura ───────────────────────────────────────────────
// personas: [{ id, nombre, cargo?, jefeId?, email?, etiqueta? }]. La jefatura cuenta si está en el conjunto
// (sirve para toda la empresa o para el organigrama interno de un equipo).
// op: { onPersona(persona), icono, vacio: 'texto si no hay nadie', ayudaSinJefaturas }
function organigramaPersonas(personas, op = {}) {
  if (!personas.length) return vacio(op.vacio ?? 'Aún no hay personas.');
  const ids = new Set(personas.map(p => p.id));
  const jefeAqui = p => (p.jefeId && ids.has(p.jefeId) ? p.jefeId : null);
  const reportes = id => personas.filter(p => jefeAqui(p) === id);
  const enArbol = personas.filter(p => jefeAqui(p) || reportes(p.id).length);
  const sueltos = personas.filter(p => !enArbol.includes(p));
  const buscable = p => ({ buscar: normalizar(`${p.nombre} ${p.cargo ?? ''} ${p.email ?? ''}`) });
  const abrir = p => op.onPersona && (() => op.onPersona(p));
  const tarjeta = p => el(op.onPersona ? 'button' : 'div', { type: 'button', className: 'org-nodo org-nodo--persona', title: p.email ?? '', dataset: buscable(p), onclick: abrir(p) },
    el('span', { className: 'org-avatar', ariaHidden: 'true', textContent: iniciales(p.nombre) }),
    el('span', { className: 'org-persona__txt' }, el('b', { textContent: p.nombre }),
      el('small', { className: 'org-cargo', textContent: p.cargo || p.etiqueta || '' }),
      reportes(p.id).length > 0 && el('small', { className: 'org-muted', textContent: plural(reportes(p.id).length, 'reporte directo', 'reportes directos') })));
  const par = p => el('li', {}, el(op.onPersona ? 'button' : 'div', { type: 'button', className: 'org-persona', title: p.email ?? '', dataset: buscable(p), onclick: abrir(p) },
    el('span', { className: 'org-avatar', ariaHidden: 'true', textContent: iniciales(p.nombre) }),
    el('span', { className: 'org-persona__txt' }, el('span', { textContent: p.nombre }), p.cargo && el('small', { className: 'org-muted', textContent: p.cargo }))));
  return el('div', { className: 'org-personas' },
    enArbol.length > 0 && arbolOrg(enArbol.filter(p => !jefeAqui(p)), p => reportes(p.id), tarjeta),
    sueltos.length > 0 && el('div', { className: 'org-sueltos' },
      el('h3', { className: 'org-subtitulo', textContent: enArbol.length ? 'Sin jefatura asignada' : 'Integrantes' }),
      !enArbol.length && el('p', { className: 'org-muted', textContent: op.ayudaSinJefaturas ?? 'Nadie tiene jefatura asignada: asígnala para ver la jerarquía.' }),
      el('ul', { className: 'org-pares org-pares--grid' }, ...sueltos.map(par))));
}

// ── Equipos anidados ────────────────────────────────────────────────────
// equipos: [{ id, nombre, padreId?, tipo?: 'area' | 'transversal', integrantes: [idPersona] }]
function arbolEquipos(equipos) {
  const lista = [...equipos].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const porId = new Map(lista.map(g => [g.id, g]));
  const hijos = new Map(lista.map(g => [g.id, []]));
  const raices = [];
  for (const g of lista) (g.padreId && porId.has(g.padreId) ? hijos.get(g.padreId) : raices).push(g);
  const orden = [];
  const recorrer = (g, nivel) => { orden.push({ g, nivel }); hijos.get(g.id).forEach(h => recorrer(h, nivel + 1)); };
  raices.forEach(g => recorrer(g, 0));
  const debajo = id => hijos.get(id).flatMap(h => [h, ...debajo(h.id)]);
  const integrantes = id => new Set([porId.get(id), ...debajo(id)].flatMap(g => g.integrantes ?? []));
  const ruta = id => { const r = []; for (let g = porId.get(id); g; g = porId.get(g.padreId)) r.unshift(g); return r; };
  return { porId, hijos, raices, orden, debajo, integrantes, ruta };
}

// op: { hrefEquipo(equipo) | onEquipo(equipo), icono, vacio }
function organigramaEquipos(equipos, op = {}) {
  const icono = op.icono ?? iconoPhosphor;
  const arbol = arbolEquipos(equipos);
  if (!arbol.raices.length) return vacio(op.vacio ?? 'Aún no hay equipos.');

    if (op.hrefEquipo) props.href = op.hrefEquipo(g);

    return el(op.hrefEquipo ? 'a' : op.onEquipo ? 'button' : 'div', props,
      el('div', { className: 'org-nodo__head' }, el('b', { textContent: g.nombre }), (op.hrefEquipo || op.onEquipo) && icono('arrow-right')),
      el('span', { className: 'org-muted', textContent: [plural(arbol.integrantes(g.id).size, 'persona', 'personas'), subs && plural(subs, 'subequipo', 'subequipos')].filter(Boolean).join(' · ') }));
  };
  const areas = arbol.raices.filter(g => g.tipo !== 'transversal');
  const transversales = arbol.raices.filter(g => g.tipo === 'transversal');
  return el('div', { className: 'org-personas' },
